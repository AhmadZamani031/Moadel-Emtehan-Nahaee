<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>محاسبه‌گر معدل امتحان نهایی ۱۴۰۵ | دقیق و آنلاین</title>
    <meta name="description" content="ابزار رایگان و دقیق محاسبه معدل امتحانات نهایی پایه دوازدهم و یازدهم برای کنکور ۱۴۰۵ با آخرین ضرایب آموزش و پرورش.">
    <meta name="keywords" content="معدل کنکور, محاسبه معدل نهایی, ضرایب کنکور 1405, تاثیر معدل, ماشین حساب معدل">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#6366f1">
    
    <link rel="stylesheet" href="css/style.css">

    <script src="js/tailwind.js"></script> 
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Vazirmatn', 'sans-serif'] },
                    colors: {
                        glass: { 100: 'rgba(255, 255, 255, 0.1)', dark: 'rgba(17, 24, 39, 0.7)' },
                        primary: '#6366f1',
                        secondary: '#ec4899'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col">

    <div class="animated-bg"></div>

    <nav class="fixed top-0 w-full z-50 glass-panel shadow-sm transition-all duration-300">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div id="back-btn" class="hidden cursor-pointer p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
                    </svg>
                </div>
                <h1 class="font-bold text-lg tracking-tight">معدل کنکور ۱۴۰۵</h1>
            </div>
            
            <button id="theme-toggle" class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition focus:outline-none relative w-10 h-10 flex items-center justify-center">
                <svg id="sun-icon" class="w-6 h-6 absolute transition-transform duration-300 opacity-0 rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <svg id="moon-icon" class="w-6 h-6 absolute transition-transform duration-300 opacity-100 rotate-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 24.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
        </div>
        <div class="w-full bg-gray-200 dark:bg-gray-700 h-1">
            <div id="progress-bar" class="bg-gradient-to-l from-primary to-secondary h-1 w-0 transition-all duration-500 ease-out"></div>
        </div>
    </nav>

    <main id="app" class="flex-grow pt-20 pb-10 px-4 max-w-md mx-auto w-full relative min-h-[80vh]">
        </main>

    <footer class="text-center py-4 text-xs text-gray-400 dark:text-gray-500 glass-panel mt-auto">
        <p>طراحی شده برای داوطلبان کنکور ۱۴۰۵ | نسخه ۲.۰</p>
    </footer>

    <template id="step-intro">
        <div class="flex flex-col items-center justify-center min-h-[60vh] text-center space-y-6 fade-in">
            <div class="w-24 h-24 bg-gradient-to-br from-primary to-secondary rounded-2xl shadow-xl flex items-center justify-center text-white mb-4 rotate-3 hover:rotate-6 transition-transform">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-l from-primary to-secondary">
                ماشین حساب معدل
            </h2>
            <div class="glass-panel p-4 rounded-xl text-sm leading-6 shadow-sm border-r-4 border-yellow-400 text-right">
                <strong class="block text-yellow-600 dark:text-yellow-400 mb-1">⚠️ راهنمای استفاده:</strong>
                نمرات خود را وارد کنید تا معدل کتبی دقیق با توجه به ضرایب ۱۴۰۵ محاسبه شود. محاسبات به صورت آفلاین و امن انجام می‌شود.
            </div>
            <button onclick="goToStep(1)" class="w-full py-4 bg-primary hover:bg-indigo-600 text-white rounded-xl shadow-lg shadow-indigo-500/30 font-bold text-lg transition transform active:scale-95">
                شروع محاسبه
            </button>
        </div>
    </template>

    <template id="step-major">
        <div class="space-y-6 slide-up">
            <h2 class="text-xl font-bold text-center">رشته تحصیلی خود را انتخاب کنید</h2>
            <div class="grid grid-cols-1 gap-4">
                <button onclick="selectMajor('experimental')" class="group relative overflow-hidden glass-panel p-5 rounded-2xl shadow-sm hover:shadow-md transition text-right border-r-4 border-green-500">
                    <span class="absolute top-0 left-0 w-full h-full bg-green-500/5 group-hover:bg-green-500/10 transition"></span>
                    <div class="flex justify-between items-center relative z-10">
                        <div class="flex flex-col">
                            <span class="text-lg font-bold">علوم تجربی</span>
                            <span class="text-xs text-gray-500 dark:text-gray-400 mt-1">شامل زیست، شیمی، ریاضی...</span>
                        </div>
                        <span class="text-2xl">🧬</span>
                    </div>
                </button>
                
                <button onclick="selectMajor('math')" class="group relative overflow-hidden glass-panel p-5 rounded-2xl shadow-sm hover:shadow-md transition text-right border-r-4 border-blue-500">
                    <span class="absolute top-0 left-0 w-full h-full bg-blue-500/5 group-hover:bg-blue-500/10 transition"></span>
                    <div class="flex justify-between items-center relative z-10">
                        <div class="flex flex-col">
                            <span class="text-lg font-bold">ریاضی و فیزیک</span>
                            <span class="text-xs text-gray-500 dark:text-gray-400 mt-1">شامل حسابان، هندسه، گسسته...</span>
                        </div>
                        <span class="text-2xl">📐</span>
                    </div>
                </button>

                <button onclick="selectMajor('humanities')" class="group relative overflow-hidden glass-panel p-5 rounded-2xl shadow-sm hover:shadow-md transition text-right border-r-4 border-yellow-500">
                    <span class="absolute top-0 left-0 w-full h-full bg-yellow-500/5 group-hover:bg-yellow-500/10 transition"></span>
                    <div class="flex justify-between items-center relative z-10">
                        <div class="flex flex-col">
                            <span class="text-lg font-bold">علوم انسانی</span>
                            <span class="text-xs text-gray-500 dark:text-gray-400 mt-1">شامل ادبیات، عربی، فلسفه...</span>
                        </div>
                        <span class="text-2xl">📚</span>
                    </div>
                </button>
            </div>
        </div>
    </template>

    <template id="step-grade">
        <div class="space-y-6 slide-up">
            <h2 class="text-xl font-bold text-center">پایه تحصیلی را انتخاب کنید</h2>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="selectGrade('11')" class="glass-panel p-6 rounded-2xl flex flex-col items-center gap-3 hover:border-primary/50 transition active:scale-95">
                    <span class="text-4xl font-bold text-gray-800 dark:text-white">۱۱</span>
                    <span class="text-sm font-medium">پایه یازدهم</span>
                    <span class="text-xs bg-indigo-100 text-indigo-800 px-2 py-1 rounded-full dark:bg-indigo-900 dark:text-indigo-200">تاثیر: ۱۷٪</span>
                </button>
                
                <button onclick="selectGrade('12')" class="glass-panel p-6 rounded-2xl flex flex-col items-center gap-3 hover:border-secondary/50 transition active:scale-95">
                    <span class="text-4xl font-bold text-gray-800 dark:text-white">۱۲</span>
                    <span class="text-sm font-medium">پایه دوازدهم</span>
                    <span class="text-xs bg-pink-100 text-pink-800 px-2 py-1 rounded-full dark:bg-pink-900 dark:text-pink-200">تاثیر: ۶۳٪</span>
                </button>
            </div>
        </div>
    </template>

    <template id="step-calc">
        <div class="space-y-4 slide-up pb-24">
            <div class="flex justify-between items-end mb-2">
                <h2 class="text-lg font-bold" id="calc-title">وارد کردن نمرات</h2>
                <button onclick="resetInputs()" class="text-xs text-red-500 hover:text-red-600 bg-red-50 dark:bg-red-900/30 px-2 py-1 rounded transition">پاک کردن همه</button>
            </div>
            
            <div id="inputs-container" class="space-y-3">
                </div>

            <div class="fixed bottom-0 left-0 right-0 glass-panel border-t border-gray-200 dark:border-gray-700 p-4 pb-6 shadow-[0_-5px_20px_rgba(0,0,0,0.1)] z-40">
                <div class="max-w-md mx-auto flex justify-between items-center">
                    <div>
                        <div class="text-xs text-gray-500 mb-1">معدل محاسبه شده</div>
                        <div class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary" id="live-score">0.00</div>
                    </div>
                    <button onclick="calculateFinal()" class="bg-gray-900 dark:bg-white text-white dark:text-gray-900 px-6 py-2 rounded-lg font-bold shadow-lg text-sm active:scale-95 transition">
                        مشاهده کارنامه
                    </button>
                </div>
            </div>
        </div>
    </template>

    <template id="step-result">
        <div class="flex flex-col items-center space-y-8 slide-up">
            <h2 class="text-xl font-bold">نتیجه نهایی</h2>
            
            <div class="relative w-48 h-48">
                <svg class="w-full h-full" viewBox="0 0 100 100">
                    <circle class="text-gray-200 dark:text-gray-700 stroke-current" stroke-width="8" cx="50" cy="50" r="40" fill="transparent"></circle>
                    <circle id="score-ring" class="text-primary stroke-current progress-ring__circle" stroke-width="8" stroke-linecap="round" cx="50" cy="50" r="40" fill="transparent" stroke-dasharray="251.2" stroke-dashoffset="251.2"></circle>
                </svg>
                <div class="absolute top-0 left-0 w-full h-full flex flex-col items-center justify-center">
                    <span class="text-4xl font-bold text-gray-800 dark:text-white" id="final-score-display">0</span>
                    <span class="text-xs text-gray-500 mt-1">از ۲۰</span>
                </div>
            </div>

            <div class="w-full grid grid-cols-2 gap-3">
                <div class="glass-panel p-3 rounded-xl text-center">
                    <div class="text-xs text-gray-500">پایه</div>
                    <div class="font-bold text-lg" id="res-grade">--</div>
                </div>
                <div class="glass-panel p-3 rounded-xl text-center">
                    <div class="text-xs text-gray-500">تاثیر در کنکور</div>
                    <div class="font-bold text-lg text-secondary" id="res-weight">--%</div>
                </div>
            </div>

            <button onclick="shareResult()" class="w-full flex items-center justify-center gap-2 py-3 bg-green-600 hover:bg-green-700 text-white rounded-xl shadow-lg transition active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
                </svg>
                اشتراک‌گذاری
            </button>
            
            <button onclick="goToStep(0); localStorage.removeItem('gpaState'); init();" class="text-sm text-gray-500 underline mt-4 pb-10">
                شروع مجدد
            </button>
        </div>
    </template>

    <script src="js/script.js"></script>

</body>
</html>
