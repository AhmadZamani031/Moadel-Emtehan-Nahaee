                </button>

                <button onclick="selectMajor('language')" class="group relative overflow-hidden glass-panel p-4 rounded-xl shadow-sm hover:shadow-md transition text-right border-r-4 border-pink-500">
                    <span class="absolute top-0 left-0 w-full h-full bg-pink-500/5 group-hover:bg-pink-500/10 transition"></span>
                    <div class="flex justify-between items-center relative z-10">
                        <span class="font-bold">زبان‌های خارجی</span>
                        <span class="text-2xl">🗣️</span>
                    </div>
                </button>
            </div>
        </div>
    </template>

    <template id="step-grade">
        <div class="space-y-6 slide-up">
            <h2 class="text-lg font-bold text-center">پایه تحصیلی را انتخاب کنید</h2>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="selectGrade('11')" class="glass-panel p-6 rounded-2xl flex flex-col items-center gap-3 hover:border-primary/50 transition active:scale-95">
                    <span class="text-4xl font-bold text-gray-800 dark:text-white">۱۱</span>
                    <span class="text-sm font-medium">پایه یازدهم</span>
                </button>
                
                <button onclick="selectGrade('12')" class="glass-panel p-6 rounded-2xl flex flex-col items-center gap-3 hover:border-secondary/50 transition active:scale-95">
                    <span class="text-4xl font-bold text-gray-800 dark:text-white">۱۲</span>
                    <span class="text-sm font-medium">پایه دوازدهم</span>
                </button>
            </div>
        </div>
    </template>

    <template id="step-calc">
        <div class="space-y-4 slide-up pb-24">
            <div class="flex justify-between items-end mb-2">
                <h2 class="text-lg font-bold" id="calc-title">وارد کردن نمرات</h2>
                <button onclick="resetInputs()" class="text-xs text-red-500 hover:text-red-600 bg-red-50 dark:bg-red-900/30 px-2 py-1 rounded transition">پاک کردن</button>
            </div>
            
            <div id="inputs-container" class="space-y-3">
                </div>

            <div class="max-w-md mx-auto glass-panel rounded-2xl px-3 py-2.5 flex items-start gap-3 border border-accent/30">
                    <div class="w-9 h-9 rounded-full bg-accent/10 text-accent flex items-center justify-center flex-shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.75V4.5m0 15v-2.25m4.5-6H18m-12 0h1.5m9.546 4.546l1.591 1.591M4.863 6.863l1.591 1.591m0 7.092l-1.591 1.591m10.774-10.774l-1.591 1.591M12 9a3 3 0 100 6 3 3 0 000-6z" />
                        </svg>
                    </div>
                    <div class="flex-1 space-y-1">
                        <div class="text-[11px] text-gray-500">هدف‌گذاری هوشمند معدل</div>
                        <div class="flex items-center gap-2">
                            <input
                                id="target-gpa-input"
                                type="number"
                                inputmode="decimal"
                                step="0.01"
                                min="0"
                                max="20"
                                placeholder="مثلاً ۱۹.۵"
                                class="w-28 bg-white dark:bg-gray-900/80 border border-accent/40 rounded-lg px-2 py-1 text-xs text-center font-bold focus:ring-2 focus:ring-accent focus:outline-none transition-all dir-ltr"
                            >
                            <button
                                onclick="calculateTargetPath()"
                                class="flex-1 bg-accent hover:bg-accent/90 text-white text-xs font-bold rounded-lg px-3 py-1.5 shadow-sm active:scale-95 transition"
                            >
                                محاسبه مسیر
                            </button>
                        </div>
                        <p id="target-gpa-message" class="text-[10px] text-gray-500 leading-4"></p>
                    </div>
                </div>
            
            <div class="fixed bottom-0 left-0 right-0 glass-panel border-t border-gray-200 dark:border-gray-700 p-4 pb-6 shadow-[0_-5px_20px_rgba(0,0,0,0.1)] z-30 rounded-t-2xl">
                <div class="max-w-md mx-auto flex justify-between items-center">
                    <div>
                        <div class="text-xs text-gray-500 mb-1">معدل تراز شده</div>
                        <div class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary" id="live-score">0.00</div>
                    </div>
                    <button onclick="calculateFinal()" class="bg-gray-900 dark:bg-white text-white dark:text-gray-900 px-6 py-2 rounded-lg font-bold shadow-lg text-sm active:scale-95 transition">
                        مشاهده نتیجه
                    </button>
                </div>
            </div>
        </div>
    </template>

    <template id="step-result">
        <div class="flex flex-col items-center space-y-8 slide-up">
            <h2 class="text-xl font-bold">نتیجه نهایی</h2>
            
            <div class="relative w-48 h-48">
                <svg class="w-full h-full" viewBox="0 0 100 100">
                    <circle class="text-gray-200 dark:text-gray-700 stroke-current" stroke-width="8" cx="50" cy="50" r="40" fill="transparent"></circle>
                    <circle id="score-ring" class="text-primary stroke-current progress-ring__circle" stroke-width="8" stroke-linecap="round" cx="50" cy="50" r="40" fill="transparent" stroke-dasharray="251.2" stroke-dashoffset="251.2"></circle>
                </svg>
                <div class="absolute top-0 left-0 w-full h-full flex flex-col items-center justify-center">
                    <span class="text-4xl font-bold text-gray-800 dark:text-white" id="final-score-display">0</span>
                    <span class="text-xs text-gray-500 mt-1">از ۲۰</span>
                </div>
            </div>

            <div class="w-full grid grid-cols-2 gap-3">
                <div class="glass-panel p-3 rounded-xl text-center">
                    <div class="text-xs text-gray-500">پایه</div>
                    <div class="font-bold text-lg" id="res-grade">--</div>
                </div>
                <div class="glass-panel p-3 rounded-xl text-center">
                    <div class="text-xs text-gray-500">رشته</div>
                    <div class="font-bold text-lg text-primary" id="res-major">--</div>
                </div>
            </div>

            <button onclick="shareResult()" class="w-full flex items-center justify-center gap-2 py-3 bg-green-600 hover:bg-green-700 text-white rounded-xl shadow-lg transition active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
                </svg>
                اشتراک‌گذاری
            </button>
        </div>
    </template>

    <template id="step-about">
        <section id="page-about" class="space-y-6 fade-in pt-4">
            <div class="glass-panel p-5 rounded-2xl shadow-sm border-r-4 border-primary text-right space-y-3">
                <h2 class="text-xl font-bold text-gray-800 dark:text-white mb-1">درباره دستیار تحصیلی من</h2>
                <p class="text-sm text-gray-600 dark:text-gray-300 leading-relaxed">
                    هدف این سایت کمک به دانش‌آموزان است تا معدل نهایی و معدل سوابق تحصیلی خود را با دقت بالا و مطابق آخرین ضرایب رسمی محاسبه کنند؛
                    تا بتوانند برای انتخاب رشته، برنامه‌ریزی کنکور و تصمیم‌های مهم تحصیلی، تصویر شفاف‌تری از وضعیت خود داشته باشند.
                </p>
                <p class="text-sm text-gray-600 dark:text-gray-300 leading-relaxed">
                    این ابزار با همکاری توسعه‌دهنده و هوش مصنوعی ساخته و به‌روزرسانی شده است تا تجربه دیجیتال آموزشی مدرن‌تری فراهم شود؛
                    از طراحی رابط کاربری تا منطق محاسبات و امکاناتی مثل هدف‌گذاری معدل و تایمر مطالعه، همگی با تمرکز بر سادگی، دقت و زیبایی پیاده‌سازی شده‌اند.
                </p>
            </div>

        </section>
    </template>

    <script src="js/script.js"></script>

        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
