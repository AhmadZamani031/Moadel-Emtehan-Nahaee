    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', 'sans-serif'],
                    },
                    colors: {
                        glass: {
                            100: 'rgba(255, 255, 255, 0.1)',

    <style>
        /* Base Reset & Custom Scrollbar */
        body {
            font-family: 'Vazirmatn', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Glassmorphism Backgrounds */
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .dark .glass-panel {
            background: rgba(31, 41, 55, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Animated Gradient Background */
        .animated-bg {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.15;
        }
        .dark .animated-bg {
            opacity: 0.1;
            background: linear-gradient(-45deg, #1a1a2e, #16213e, #0f3460, #533483);
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Progress Ring */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.5s ease-in-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* Animations */
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .slide-up { animation: slideUp 0.4s ease-out forwards; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* Input specific styling */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>

                ],
                '11': [
                    { name: 'فارسی ۲', coeff: 5.95 },

                    { name: 'دین و زندگی ۲', coeff: 4.78 },
                    { name: 'زبان انگلیسی ۲', coeff: 3.32 },
                    { name: 'زیست شناسی ۲', coeff: 6.39 },
                    { name: 'شیمی ۲', coeff: 5.27 },
                    { name: 'ریاضی ۲', coeff: 5.00 }, // Logical filler

            humanities: {

        // Strict override for the Prompt's specific lists if they differ from logic above

        ];
        COEFFICIENTS.experimental['11'] = [
            { name: 'فارسی ۲', coeff: 5.95 }, { name: 'عربی ۲', coeff: 2.62 }, { name: 'دین و زندگی ۲', coeff: 4.78 },
            { name: 'زبان انگلیسی ۲', coeff: 3.32 }, { name: 'زیست شناسی ۲', coeff: 6.39 }, { name: 'شیمی ۲', coeff: 5.27 }
        ];
        COEFFICIENTS.humanities['11'] = [
            { name: 'فارسی ۲', coeff: 5.95 }, { name: 'دین و زندگی ۲', coeff: 4.78 }, { name: 'زبان انگلیسی ۲', coeff: 3.32 },
            { name: 'عربی ۲', coeff: 4.23 }, { name: 'تاریخ ۲', coeff: 5.24 }, { name: 'جامعه شناسی ۲', coeff: 4.82 }
        ];


        const WEIGHTS = { '11': 0.17, '12': 0.43 };

        // --- STATE ---
        let state = {
            step: 0,
            major: null,
            grade: null,
            scores: {}
        };

        // --- DOM ELEMENTS ---
        const app = document.getElementById('app');
        const backBtn = document.getElementById('back-btn');
        const progressBar = document.getElementById('progress-bar');
        const themeToggle = document.getElementById('theme-toggle');

        // --- INITIALIZATION ---
        function init() {
            // Load theme
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('moon-icon').classList.add('hidden');
                document.getElementById('sun-icon').classList.remove('hidden');
            }

            // Load saved data
            const savedState = localStorage.getItem('gpaState');
            if (savedState) {
                state = JSON.parse(savedState);
                if (state.step > 0) goToStep(state.step);
                else renderStep(0);
            } else {
                renderStep(0);
            }

            // Listeners
            themeToggle.addEventListener('click', toggleTheme);
            backBtn.addEventListener('click', goBack);
        }

        // --- THEME ---
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            
            document.getElementById('moon-icon').classList.toggle('hidden');
            document.getElementById('sun-icon').classList.toggle('hidden');
        }

        // --- NAVIGATION & RENDERING ---
        function goToStep(stepIndex) {
            state.step = stepIndex;
            saveState();
            renderStep(stepIndex);
            updateProgressBar(stepIndex);
            
            backBtn.style.display = stepIndex === 0 ? 'none' : 'block';
        }

        function goBack() {
            if (state.step > 0) {
                goToStep(state.step - 1);
            }
        }

        function updateProgressBar(step) {
            const width = (step / 4) * 100; // 4 total steps (Intro, Major, Grade, Calc, Result)
            progressBar.style.width = `${width}%`;
        }

        function renderStep(index) {
            app.innerHTML = '';
            let templateId = '';
            
            switch(index) {
                case 0: templateId = 'step-intro'; break;
                case 1: templateId = 'step-major'; break;
                case 2: templateId = 'step-grade'; break;
                case 3: templateId = 'step-calc'; break;
                case 4: templateId = 'step-result'; break;
            }

            const template = document.getElementById(templateId);
            const clone = template.content.cloneNode(true);
            app.appendChild(clone);

            // Post-render logic
            if (index === 3) initCalculator();
            if (index === 4) initResult();
        }

        // --- LOGIC FUNCTIONS ---
        function selectMajor(major) {
            state.major = major;
            goToStep(2);
        }

        function selectGrade(grade) {
            state.grade = grade;
            // Clear previous scores if major/grade changed to avoid mismatch keys
            // But we keep them if they match to allow persistence
            goToStep(3);
        }

        function saveState() {
            localStorage.setItem('gpaState', JSON.stringify(state));
        }

        function resetInputs() {
            state.scores = {};
            saveState();
            initCalculator();
        }

        // --- CALCULATOR LOGIC ---
        function initCalculator() {
            const container = document.getElementById('inputs-container');
            const title = document.getElementById('calc-title');
            const subjects = COEFFICIENTS[state.major][state.grade];
            
            title.innerText = `نمرات پایه ${state.grade} ${getMajorName(state.major)}`;
            container.innerHTML = '';

            subjects.forEach((sub, idx) => {
                const score = state.scores[sub.name] || '';
                
                const div = document.createElement('div');
                div.className = "glass-panel p-3 rounded-xl flex items-center justify-between gap-3 animate-slide-in";
                div.style.animationDelay = `${idx * 0.05}s`;
                
                div.innerHTML = `
                    <div class="flex flex-col flex-grow">
                        <label class="font-bold text-sm text-gray-700 dark:text-gray-200">${sub.name}</label>
                        <span class="text-[10px] text-gray-500 bg-gray-100 dark:bg-gray-700 w-fit px-1.5 rounded mt-1">ضریب: ${sub.coeff}</span>
                    </div>
                    <input 
                        type="number" 
                        inputmode="decimal" 
                        placeholder="--" 
                        value="${score}"
                        class="w-20 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 rounded-lg p-2 text-center font-bold text-lg focus:ring-2 focus:ring-primary focus:outline-none transition-all"
                        oninput="handleInput(this, '${sub.name}')"
                        onblur="validateInput(this, '${sub.name}')"
                    >
                `;
                container.appendChild(div);
            });
            
            calculateLive();
        }

        function handleInput(el, subjectName) {
            let val = parseFloat(el.value);
            
            // Logic: Don't restrict typing, but prepare for validation
            state.scores[subjectName] = el.value; // Save raw string first
            calculateLive();
        }

        function validateInput(el, subjectName) {
            let val = parseFloat(el.value);
            if (isNaN(val)) {
                // If empty or invalid, leave as is (treated as 0 in calc)
                return;
            }

            // Clamp 0-20
            if (val < 0) val = 0;
            if (val > 20) val = 20;

            // Round to nearest 0.25
            val = Math.round(val * 4) / 4;

            el.value = val;
            state.scores[subjectName] = val;
            saveState();
            calculateLive();
        }

        function calculateLive() {
            const subjects = COEFFICIENTS[state.major][state.grade];
            let totalWeightedScore = 0;
            let totalCoeffs = 0;

            subjects.forEach(sub => {
                let score = parseFloat(state.scores[sub.name]);
                if (isNaN(score)) score = 0;
                
                totalWeightedScore += score * sub.coeff;
                totalCoeffs += sub.coeff;
            });

            const average = totalCoeffs > 0 ? (totalWeightedScore / totalCoeffs) : 0;
            document.getElementById('live-score').innerText = average.toFixed(4); // Show precise number
        }

        function calculateFinal() {
            goToStep(4);
        }

        // --- RESULT LOGIC ---
        function initResult() {
            const subjects = COEFFICIENTS[state.major][state.grade];
            let totalWeightedScore = 0;
            let totalCoeffs = 0;

            subjects.forEach(sub => {
                let score = parseFloat(state.scores[sub.name]);
                if (isNaN(score)) score = 0;
                totalWeightedScore += score * sub.coeff;
                totalCoeffs += sub.coeff;
            });

            const average = totalCoeffs > 0 ? (totalWeightedScore / totalCoeffs) : 0;
            const impact = WEIGHTS[state.grade] * 100;

            // Animate number
            const displayEl = document.getElementById('final-score-display');
            let start = 0;
            const duration = 1000;
            const startTime = performance.now();

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Ease out quart
                const ease = 1 - Math.pow(1 - progress, 4);
                
                const currentVal = start + (average - start) * ease;
                displayEl.innerText = currentVal.toFixed(2);

                // Animate Ring
                const circle = document.getElementById('score-ring');
                const radius = circle.r.baseVal.value;
                const circumference = radius * 2 * Math.PI;
                const offset = circumference - (currentVal / 20) * circumference;
                circle.style.strokeDashoffset = offset;

                if (progress < 1) requestAnimationFrame(animate);
            }
            
            requestAnimationFrame(animate);

            // Set Text info
            document.getElementById('res-grade').innerText = state.grade === '12' ? 'دوازدهم' : 'یازدهم';
            document.getElementById('res-weight').innerText = `${impact}%`;
        }

        function getMajorName(key) {
            const map = {
                'math': 'ریاضی',
                'experimental': 'تجربی',
                'humanities': 'انسانی'
            };
            return map[key] || '';
        }

        function shareResult() {
            const score = document.getElementById('final-score-display').innerText;
            const text = `معدل کنکور ۱۴۰۵ من:\nرشته: ${getMajorName(state.major)}\nپایه: ${state.grade}\nنمره کل: ${score}\n\nمحاسبه شده با اپلیکیشن وب`;
            
            if (navigator.share) {
                navigator.share({
                    title: 'نتیجه معدل کنکور ۱۴۰۵',
                    text: text,
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(text).then(() => {
                    alert('نتیجه در کلیپ‌بورد کپی شد!');
                });
            }
        }

        // Start
        init();

    </script>
    
    </body>
</html>
